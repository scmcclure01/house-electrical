<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>House Electrical — Tests</title>
  <style>
    body { font: 13px/1.5 -apple-system, sans-serif; margin: 20px; }
    .pass { color: #2e7d32; } .fail { color: #c62828; font-weight: 600; }
    #summary { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="summary">Running…</div>
  <div id="out"></div>
  <script type="module">
    import { parseLength, formatLength } from '../js/units.js';
    import { newHouse, migrate, validate, slotsOf, slotRow, slotSide, SCHEMA_VERSION } from '../js/model.js';
    import * as store from '../js/store.js';
    import { projectOnSegment, pointInPolygon, polygonArea, labelPoint, snapAngle, snapToGrid } from '../js/geometry.js';
    import { deleteIds, findById, areaAt, normalizeDevice, isWallMounted, slotProblem, breakerName, circuitStats, unassignedDevices, nextColor, assignableBreakers, PALETTE,
      nextDeviceNum, deviceCode, renumberDevices, breakerCode, nextPanelCode, parseNum,
      groupOf, switchesFor, toggleLoad, pairSwitches, unpairSwitch, cleanSwitchGroups } from '../js/model.js';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function test(name, fn) {
      try { fn(); pass++; out.insertAdjacentHTML('beforeend', `<div class="pass">✓ ${name}</div>`); }
      catch (e) { fail++; out.insertAdjacentHTML('beforeend', `<div class="fail">✗ ${name} — ${e.message}</div>`); }
    }
    function eq(a, b) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

    // units
    test('parse 12\'6"', () => eq(parseLength(`12'6"`), 150));
    test('parse 12\'6', () => eq(parseLength(`12'6`), 150));
    test('parse 12\' 6', () => eq(parseLength(`12' 6`), 150));
    test('parse 12-6', () => eq(parseLength('12-6'), 150));
    test('parse 12 6', () => eq(parseLength('12 6'), 150));
    test('parse 12\'', () => eq(parseLength(`12'`), 144));
    test('parse 150 (inches)', () => eq(parseLength('150'), 150));
    test('parse 150"', () => eq(parseLength('150"'), 150));
    test('parse 2.5\'', () => eq(parseLength(`2.5'`), 30));
    test('parse junk → null', () => eq(parseLength('abc'), null));
    test('format 150', () => eq(formatLength(150), `12' 6"`));
    test('format 144', () => eq(formatLength(144), `12'`));
    test('format 7', () => eq(formatLength(7), `7"`));

    // slots
    test('1-pole slot', () => eq(slotsOf({ position: 7, poles: 1 }), [7]));
    test('2-pole spans n, n+2', () => eq(slotsOf({ position: 7, poles: 2 }), [7, 9]));
    test('slot row/side', () => { eq(slotRow(1), 1); eq(slotRow(2), 1); eq(slotRow(9), 5); eq(slotSide(9), 'left'); eq(slotSide(10), 'right'); });

    // model
    test('new house validates', () => eq(validate(newHouse()), []));
    test('migrate fills missing collections', () => {
      const { doc } = migrate({ schemaVersion: 1, meta: { name: 'x' } });
      eq(Array.isArray(doc.devices) && Array.isArray(doc.switchGroups), true);
    });
    test('newer schema opens read-only', () => eq(migrate({ schemaVersion: SCHEMA_VERSION + 1 }).readOnly, true));
    test('missing schemaVersion throws', () => { let threw = false; try { migrate({}); } catch { threw = true; } eq(threw, true); });
    test('overlapping breakers flagged', () => {
      const d = newHouse();
      d.breakers.push({ id: 'b1', panelId: 'p_main', position: 1, poles: 2, amps: 30 });
      d.breakers.push({ id: 'b2', panelId: 'p_main', position: 3, poles: 1, amps: 20 });
      eq(validate(d).some(e => e.includes('two breakers')), true);
    });
    test('breaker past last slot flagged', () => {
      const d = newHouse();
      d.breakers.push({ id: 'b1', panelId: 'p_main', position: 29, poles: 2, amps: 30 });
      eq(validate(d).some(e => e.includes('outside')), true);
    });

    // store / undo
    test('commit, undo, redo', () => {
      store.load(newHouse('A'));
      store.commit('rename', d => { d.meta.name = 'B'; });
      eq(store.getDoc().meta.name, 'B'); eq(store.isDirty(), true);
      store.undo(); eq(store.getDoc().meta.name, 'A');
      store.redo(); eq(store.getDoc().meta.name, 'B');
    });
    test('no-op commit is not recorded', () => {
      store.load(newHouse('A'));
      eq(store.commit('noop', d => { d.meta.name = 'A'; }), false);
      eq(store.canUndo(), false);
    });

    // geometry
    const L = [{x:0,y:0},{x:216,y:0},{x:216,y:336},{x:96,y:336},{x:96,y:216},{x:0,y:216}];
    test('project onto segment', () => { const r = projectOnSegment({x:50,y:10},{x:0,y:0},{x:100,y:0}); eq([r.along, r.d], [50, 10]); });
    test('project clamps to ends', () => eq(projectOnSegment({x:-20,y:0},{x:0,y:0},{x:100,y:0}).t, 0));
    test('point in L-shaped room', () => { eq(pointInPolygon({x:150,y:300}, L), true); eq(pointInPolygon({x:50,y:300}, L), false); });
    test('polygon area (sq in)', () => eq(Math.abs(polygonArea([{x:0,y:0},{x:120,y:0},{x:120,y:144},{x:0,y:144}])), 17280));
    test('label point inside L shape', () => eq(pointInPolygon(labelPoint(L), L), true));
    test('label point inside U shape', () => {
      const U = [{x:0,y:0},{x:30,y:0},{x:30,y:100},{x:70,y:100},{x:70,y:0},{x:100,y:0},{x:100,y:130},{x:0,y:130}];
      eq(pointInPolygon(labelPoint(U), U), true);
    });
    test('snap to 6" grid', () => eq(snapToGrid({x:14,y:-4}, 6), {x:12,y:-6}));
    test('shift locks to 45°', () => { const p = snapAngle({x:0,y:0}, {x:100,y:8}, 6); eq(p, {x:102,y:0}); });

    // cascading delete
    test('deleting a wall deletes its openings', () => {
      const d = newHouse();
      d.walls.push({ id: 'w1', floorId: 'F1', kind: 'exterior', a: {x:0,y:0}, b: {x:120,y:0}, thicknessIn: 6 });
      d.openings.push({ id: 'o1', wallId: 'w1', kind: 'door', offsetIn: 12, widthIn: 32, hinge: 'a', swing: 'left' });
      deleteIds(d, ['w1']);
      eq([d.walls.length, d.openings.length], [0, 0]);
    });
    test('deleting a breaker unassigns devices', () => {
      const d = newHouse();
      d.breakers.push({ id: 'b1', panelId: 'p_main', position: 1, poles: 1, amps: 15 });
      d.devices.push({ id: 'd1', floorId: 'F1', type: 'outlet', x: 0, y: 0, breakerId: 'b1' });
      deleteIds(d, ['b1']);
      eq(d.devices[0].breakerId, null);
    });
    test('findById finds an area', () => {
      const d = newHouse();
      d.areas.push({ id: 'a1', floorId: 'F1', name: 'X', kind: 'room', points: L });
      eq(findById(d, 'a1').kind, 'area');
    });

    // devices
    test('areaAt picks the smallest containing area', () => {
      const d = newHouse();
      d.areas.push({ id: 'big', floorId: 'F1', name: 'Bedroom', kind: 'room', points: [{x:0,y:0},{x:200,y:0},{x:200,y:200},{x:0,y:200}] });
      d.areas.push({ id: 'small', floorId: 'F1', name: 'Closet', kind: 'room', points: [{x:10,y:10},{x:50,y:10},{x:50,y:50},{x:10,y:50}] });
      eq([areaAt(d, 'F1', {x:20,y:20})?.id, areaAt(d, 'F1', {x:150,y:150})?.id, areaAt(d, 'F2', {x:20,y:20})], ['small', 'big', null]);
    });
    test('normalizeDevice sets per-type fields', () => {
      const o = normalizeDevice({ id: 'd', type: 'outlet' });
      eq([o.gfci, o.afci, o.breakerId, o.verified, 'port' in o], [false, false, null, false, false]);
      o.type = 'ethernet'; normalizeDevice(o);
      eq(['gfci' in o, o.port], [false, '']);
    });
    test('low-voltage drops are never on a breaker', () => eq(normalizeDevice({ type: 'cable', breakerId: 'b1' }).breakerId, null));
    test('ceiling lights are not wall-mounted', () => eq([isWallMounted('light', 'ceiling'), isWallMounted('light', 'wall'), isWallMounted('outlet')], [false, true, true]));
    test('deleting a wall frees its devices', () => {
      const d = newHouse();
      d.walls.push({ id: 'w1', floorId: 'F1', kind: 'interior', a: {x:0,y:0}, b: {x:96,y:0}, thicknessIn: 4 });
      d.devices.push(normalizeDevice({ id: 'd1', floorId: 'F1', type: 'outlet', x: 48, y: 2, wallId: 'w1' }));
      deleteIds(d, ['w1']);
      eq([d.devices.length, d.devices[0].wallId], [1, null]);
    });

    // panels & circuits
    function panelHouse() {
      const d = newHouse();
      d.breakers.push({ id: 'b1', panelId: 'p_main', position: 1, poles: 1, amps: 20, label: 'A', color: PALETTE[0] });
      d.breakers.push({ id: 'b3', panelId: 'p_main', position: 3, poles: 2, amps: 30, label: 'B', color: PALETTE[1] });
      d.breakers.push({ id: 'bf', panelId: 'p_main', position: 2, poles: 2, amps: 60, label: 'Feed', color: PALETTE[2] });
      d.panels[1].fedFromBreakerId = 'bf';
      return d;
    }
    test('slotProblem: free slot ok', () => eq(slotProblem(panelHouse(), 'p_main', 7, 1), null));
    test('slotProblem: 2-pole clashes with slot below', () => eq(/Slot 3/.test(slotProblem(panelHouse(), 'p_main', 1, 2, 'b1')), true));
    test('slotProblem: past last space', () => eq(/outside/.test(slotProblem(panelHouse(), 'p_main', 29, 2)), true));
    test('slotProblem ignores the breaker being moved', () => eq(slotProblem(panelHouse(), 'p_main', 3, 2, 'b3'), null));
    test('breakerName shows both slots for 2-pole', () => eq(breakerName(panelHouse(), panelHouse().breakers[1]), 'Main 3/5'));
    test('feeder breakers are not assignable', () => eq(assignableBreakers(panelHouse()).map(b => b.id), ['b1', 'b3']));
    test('nextColor skips used colors', () => eq(nextColor(panelHouse()), PALETTE[3]));
    test('circuitStats counts devices, verified, rooms', () => {
      const d = panelHouse();
      d.areas.push({ id: 'a1', floorId: 'F1', name: 'Kitchen', kind: 'room', points: [{x:0,y:0},{x:100,y:0},{x:100,y:100},{x:0,y:100}] });
      d.devices.push(normalizeDevice({ id: 'd1', floorId: 'F1', type: 'outlet', x: 10, y: 10, breakerId: 'b1', verified: true }));
      d.devices.push(normalizeDevice({ id: 'd2', floorId: 'F1', type: 'light', x: 200, y: 10, breakerId: 'b1' }));
      const s = circuitStats(d).get('b1');
      eq([s.total, s.verified, s.byType.outlet, s.rooms], [2, 1, 1, ['Exterior', 'Kitchen']]);
    });
    test('unassignedDevices skips low-voltage', () => {
      const d = newHouse();
      d.devices.push(normalizeDevice({ id: 'd1', type: 'outlet' }), normalizeDevice({ id: 'd2', type: 'ethernet' }));
      eq(unassignedDevices(d).map(x => x.id), ['d1']);
    });

    // device numbers & schema v2
    test('nextDeviceNum: type letter + floor + sequence', () => {
      const d = newHouse();
      d.devices.push({ id: 'a', type: 'outlet', floorId: 'F1', num: 'R101' }, { id: 'b', type: 'outlet', floorId: 'F1', num: 'R107' }, { id: 'c', type: 'outlet', floorId: 'F2', num: 'R201' });
      eq([nextDeviceNum(d, 'outlet', 'F1'), nextDeviceNum(d, 'outlet', 'F2'), nextDeviceNum(d, 'light', 'F1'), nextDeviceNum(d, 'cable', 'F2')], ['R108', 'R202', 'L101', 'TV201']);
    });
    test('deviceCode adds panel code + first slot', () => {
      const d = newHouse();
      d.breakers.push({ id: 'b3', panelId: 'p_main', position: 3, poles: 2, amps: 50 });
      d.devices.push({ id: 'x', type: 'receptacle240', floorId: 'F1', num: 'V101', breakerId: 'b3' }, { id: 'y', type: 'light', floorId: 'F2', num: 'L204', breakerId: null });
      eq([deviceCode(d, d.devices[0]), deviceCode(d, d.devices[1]), breakerCode(d, d.breakers[0])], ['M3-V101', 'L204', 'M3']);
    });
    test('renumberDevices groups by room in reading order', () => {
      const d = newHouse();
      d.areas.push({ id: 'k', floorId: 'F1', name: 'Kitchen', kind: 'room', points: [{x:0,y:0},{x:100,y:0},{x:100,y:100},{x:0,y:100}] });
      d.areas.push({ id: 'l', floorId: 'F1', name: 'Living', kind: 'room', points: [{x:100,y:0},{x:300,y:0},{x:300,y:100},{x:100,y:100}] });
      d.devices.push({ id: 'l1', type: 'outlet', floorId: 'F1', x: 250, y: 10 }, { id: 'k2', type: 'outlet', floorId: 'F1', x: 80, y: 90 },
        { id: 'k1', type: 'outlet', floorId: 'F1', x: 20, y: 5 }, { id: 's1', type: 'switch', floorId: 'F1', x: 150, y: 50 });
      renumberDevices(d);
      eq(Object.fromEntries(d.devices.map(x => [x.id, x.num])), { l1: 'R103', k2: 'R102', k1: 'R101', s1: 'S101' });
    });
    test('parseNum', () => eq([parseNum('TV212'), parseNum('junk')], [{ prefix: 'TV', floor: 2, seq: 12 }, null]));
    test('nextPanelCode avoids clashes', () => eq([nextPanelCode(newHouse(), 'Garage'), nextPanelCode(newHouse(), 'Sub 2')], ['G', 'S2']));
    test('v1 file migrates to v2 with numbers and panel codes', () => {
      const v1 = { schemaVersion: 1, meta: { name: 'old' }, floors: newHouse().floors, walls: [], openings: [], areas: [], switchGroups: [],
        panels: [{ id: 'p_main', name: 'Main', spaces: 30, location: '', notes: '', fedFromBreakerId: null }],
        breakers: [{ id: 'b1', panelId: 'p_main', position: 1, poles: 1, amps: 20, label: '', notes: '', color: '#000' }],
        devices: [{ id: 'd1', floorId: 'F1', type: 'switch', x: 0, y: 0, breakerId: 'b1', verified: true }] };
      const { doc } = migrate(v1);
      eq([doc.schemaVersion, doc.panels[0].code, doc.breakers[0].type, doc.devices[0].num, deviceCode(doc, doc.devices[0]), validate(doc)], [2, 'M', 'standard', 'S101', 'M1-S101', []]);
    });
    test('deleting a panel deletes its breakers and unassigns devices', () => {
      const d = newHouse();
      d.breakers.push({ id: 'b1', panelId: 'p_sub', position: 1, poles: 1, amps: 15 });
      d.devices.push({ id: 'x', type: 'outlet', floorId: 'F1', num: 'R101', breakerId: 'b1' });
      deleteIds(d, ['p_sub']);
      eq([d.panels.length, d.breakers.length, d.devices[0].breakerId], [1, 0, null]);
    });

    // switch links
    function switchHouse() {
      const d = newHouse();
      for (const [id, type] of [['s1', 'switch'], ['s2', 'switch'], ['s3', 'switch'], ['l1', 'light'], ['l2', 'light'], ['r1', 'outlet'], ['e1', 'ethernet']])
        d.devices.push(normalizeDevice({ id, type, floorId: 'F1', x: 0, y: 0, num: id.toUpperCase() }));
      return d;
    }
    test('toggleLoad links then unlinks', () => {
      const d = switchHouse();
      eq(toggleLoad(d, 's1', 'l1'), true); toggleLoad(d, 's1', 'r1');
      eq([groupOf(d, 's1').loadIds, switchesFor(d, 'r1')], [['l1', 'r1'], ['s1']]);
      eq(toggleLoad(d, 's1', 'l1'), false); toggleLoad(d, 's1', 'r1');
      eq(d.switchGroups.length, 0);
    });
    test('pairing makes a 3-way and merges loads', () => {
      const d = switchHouse();
      toggleLoad(d, 's1', 'l1'); toggleLoad(d, 's2', 'l2');
      eq(pairSwitches(d, 's1', 's2'), null);
      const g = groupOf(d, 's2');
      eq([d.switchGroups.length, g.switchIds, g.loadIds, d.devices.find(x => x.id === 's1').switchKind], [1, ['s1', 's2'], ['l1', 'l2'], '3way']);
    });
    test('no third switch (4-way) in a group', () => {
      const d = switchHouse();
      pairSwitches(d, 's1', 's2');
      eq(/exactly two/.test(pairSwitches(d, 's1', 's3')), true);
    });
    test('unpair leaves loads with the partner', () => {
      const d = switchHouse();
      toggleLoad(d, 's1', 'l1'); pairSwitches(d, 's1', 's2'); unpairSwitch(d, 's2');
      eq([groupOf(d, 's1').switchIds, groupOf(d, 's2'), d.devices.find(x => x.id === 's2').switchKind], [['s1'], null, 'single']);
    });
    test('cleanSwitchGroups drops non-switchable loads and retyped switches', () => {
      const d = switchHouse();
      d.switchGroups.push({ id: 'g', switchIds: ['s1'], loadIds: ['l1', 'e1', 's2', 'gone'] });
      cleanSwitchGroups(d);
      eq(d.switchGroups[0].loadIds, ['l1']);
      d.devices.find(x => x.id === 's1').type = 'outlet';
      cleanSwitchGroups(d);
      eq(d.switchGroups.length, 0);
    });
    test('deleting a switch removes its group', () => {
      const d = switchHouse();
      toggleLoad(d, 's1', 'l1');
      deleteIds(d, ['s1']);
      eq(d.switchGroups.length, 0);
    });

    // gestures
    test('gesture becomes one undo step', () => {
      store.load(newHouse('A'));
      store.beginGesture('drag');
      store.updateGesture(d => { d.meta.name = 'B'; });
      store.updateGesture(d => { d.meta.name = 'C'; });
      store.endGesture();
      eq(store.getDoc().meta.name, 'C');
      store.undo();
      eq([store.getDoc().meta.name, store.canUndo()], ['A', false]);
    });

    // sample file
    const sample = await (await fetch('../samples/sample-house.json')).json();
    test('sample file validates', () => eq(validate(migrate(sample).doc), []));

    document.getElementById('summary').innerHTML =
      `<span class="${fail ? 'fail' : 'pass'}">${pass} passed, ${fail} failed</span>`;
  </script>
</body>
</html>
